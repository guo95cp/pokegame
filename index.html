<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>영칼로리포케 | 나만의 포케 만들기</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header>
        <div class="brand"><img src="images/youngkcal.png" alt="영칼로리포케" /></div>
      </header>
      <nav class="steps" id="steps" aria-label="게임 단계"></nav>
      <section class="tray-section">
        <div class="section-heading">
          <h1 id="stepTitle">탄수화물을 골라주세요</h1>
          <span id="stepCounter">STEP 1 / 4</span>
        </div>
        <div class="tray-grid" id="trayGrid"></div>
        <!-- <p class="help" id="help">
          스테인리스 통을 누른 채 아래 그릇으로 끌어보세요.
        </p> -->
      </section>
      <section class="bowl-section">
        <div class="bowl-frame" id="bowlFrame">
          <canvas
            id="pokeCanvas"
            aria-label="재료를 자유롭게 놓을 수 있는 포케 그릇"
          ></canvas>
        </div>
      </section>
      <footer>
        <div class="controls">
          <button id="prevBtn" class="light">이전</button
          ><button id="resetBtn" class="light">초기화</button
          ><button id="nextBtn" class="primary">다음</button>
        </div>
      </footer>
      <section class="result hidden" id="result">
        <!-- <h2>포케 완성!</h2> -->
        <!-- <p>🎉🎉🎉</p> -->
        <canvas id="resultCanvas"></canvas>
        <div id="nutritionInfo" class="nutrition"></div>
        <p class="notice">
          ※ 본 영양 정보는 임의로 설정된 참고용 수치로, 실제 영양성분과 차이가 있을 수 있습니다.※
        </p>
        <div class="controls">
          <button id="saveBtn" class="primary">이미지 저장하기</button
          ><button id="restartBtn" class="light">다시 만들기</button>
        </div>
        <a
        href="https://연결할-링크-주소"
        target="_blank"
        rel="noopener noreferrer"
        class="share-poke-btn"
        >
        나만의 포케 자랑하기
        </a>
      </section>
      <div
        class="dialog hidden"
        id="confirmDialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialogTitle"
      >
        <div class="dialog-card">
          <h2 id="dialogTitle">전체 초기화할까요?</h2>
          <p>선택한 재료가 모두 사라집니다.</p>
          <div class="controls">
            <button id="cancelReset" class="light">취소</button
            ><button id="confirmReset" class="primary">초기화</button>
          </div>
        </div>
      </div>
    </main>
    <script src="data/ingredients.js"></script>
    <script src="data/nutrition.js"></script>
    <script src="game.js"></script>
  </body>
</html>
